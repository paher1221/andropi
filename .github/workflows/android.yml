name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime bundler deps
        run: pip install lief

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable

      - name: Bundle the native runtime (node, git, ssh, proot, ...)
        run: python tool/bundle_runtime.py

      - name: Build the agent host
        working-directory: agent
        run: |
          npm ci
          node build.mjs

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs
        run: flutter build apk --flavor full --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - uses: actions/upload-artifact@v4
        with:
          name: andropi-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
